<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PokeStat</title>
<style>
:root{--bg1:#7aa8ff;--bg2:#ff9ec7;--bg3:#8ff0d0;--glass:rgba(255,255,255,.38);--glass2:rgba(255,255,255,.55);--bd:rgba(255,255,255,.65);--tx:#10131c;--tx2:#4a5166;--sh:0 8px 32px rgba(40,50,90,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1b2a6b;--bg2:#5a1f55;--bg3:#0f4f4a;--glass:rgba(40,44,64,.45);--glass2:rgba(70,76,104,.55);--bd:rgba(255,255,255,.16);--tx:#f2f4fb;--tx2:#a9b0c6;--sh:0 8px 32px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg1:#1b2a6b;--bg2:#5a1f55;--bg3:#0f4f4a;--glass:rgba(40,44,64,.45);--glass2:rgba(70,76,104,.55);--bd:rgba(255,255,255,.16);--tx:#f2f4fb;--tx2:#a9b0c6;--sh:0 8px 32px rgba(0,0,0,.45)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;color:var(--tx);background:var(--bg1);min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 15% 10%,var(--bg2),transparent 45%),radial-gradient(circle at 85% 30%,var(--bg3),transparent 45%),radial-gradient(circle at 40% 95%,var(--bg1),transparent 55%),var(--bg1)}
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--bd);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.5);border-radius:24px}
header{max-width:900px;margin:0 auto;padding:22px 16px 6px}
h1{margin:0;font-size:34px;letter-spacing:-.5px}
h1 span{background:linear-gradient(90deg,#ff5c8a,#ffb347);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--tx2);margin:2px 0 14px;font-size:14px}
main{max-width:900px;margin:0 auto;padding:0 16px 120px}
input[type=search]{width:100%;padding:13px 16px;border-radius:16px;border:1px solid var(--bd);background:var(--glass2);color:var(--tx);font-size:16px;outline:none;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chip{flex:none;padding:7px 13px;border-radius:99px;border:1px solid var(--bd);background:var(--glass);color:var(--tx);font-size:13px;cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.chip.on{background:var(--tx);color:var(--bg1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{padding:14px;cursor:pointer;transition:transform .2s}
.card:active{transform:scale(.97)}
.orb{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:700;color:#fff;margin-bottom:8px;box-shadow:inset 0 6px 14px rgba(255,255,255,.55),inset 0 -8px 14px rgba(0,0,0,.2),0 6px 14px rgba(0,0,0,.2)}
.card b{display:block;font-size:16px}
.tg{display:inline-block;padding:3px 9px;border-radius:99px;color:#fff;font-size:11.5px;font-weight:600;margin:4px 4px 0 0}
.gen{float:right;font-size:11px;color:var(--tx2)}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:6px;z-index:20;border-radius:99px}
.tabbar button{border:0;background:none;color:var(--tx2);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;cursor:pointer}
.tabbar button.on{background:var(--glass2);color:var(--tx);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.sheet{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.35)}
.sheet.open{display:flex}
.panel{width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));border-radius:28px 28px 0 0;background:var(--glass2)}
.panel h2{margin:0}
.panel h3{margin:18px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx2)}
.x{float:right;border:0;background:var(--glass);color:var(--tx);width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer}
.row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.row .l{width:42px;color:var(--tx2)}.row .n{width:30px;text-align:right;font-weight:600}
.bar{flex:1;height:9px;border-radius:9px;background:rgba(128,128,128,.22);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px}
.mv{display:inline-block;padding:6px 11px;margin:0 6px 6px 0;border-radius:12px;background:var(--glass);border:1px solid var(--bd);font-size:13px}
.w{display:inline-block;margin:0 6px 6px 0;font-size:12px;color:var(--tx2)}
.w .tg{margin:0 3px 0 0}
.gym{padding:16px;margin-bottom:12px;display:flex;gap:14px;align-items:flex-start}
.num{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff}
.gym p{margin:3px 0;font-size:13.5px;color:var(--tx2)}
.gym b{color:var(--tx)}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:3px;border-radius:3px;background:linear-gradient(var(--bg2),var(--bg3))}
.tl .st{position:relative;padding:14px 16px;margin-bottom:12px}
.tl .st::before{content:"";position:absolute;left:-23px;top:20px;width:15px;height:15px;border-radius:50%;background:var(--tx);border:3px solid var(--bg1)}
.note{padding:14px 16px;font-size:13px;color:var(--tx2);margin-top:14px}
.view{display:none}.view.on{display:block}
</style>
</head>

const $=s=>document.querySelector(s);
const tag=t=>`<span class="tg" style="background:${T[t][1]}">${T[t][0]}</span>`;
function mult(def){const r={};for(const a in C){let m=1;for(const d of def){if(C[a][0].split(" ").includes(d))m*=2;if(C[a][1].split(" ").includes(d))m*=.5;if(C[a][2].split(" ").includes(d))m=0}r[a]=m}return r}
let gen="all",ty="all",q="";
function chips(){$("#gf").innerHTML=[["all","Toutes"],["8","Gen 8"],["9","Gen 9"],["ZA","Z-A"]].map(g=>`<button class="chip ${gen==g[0]?"on":""}" data-g="${g[0]}">${g[1]}</button>`).join("");
$("#tf").innerHTML=`<button class="chip ${ty=="all"?"on":""}" data-t="all">Tous types</button>`+Object.keys(T).map(t=>`<button class="chip ${ty==t?"on":""}" data-t="${t}">${T[t][0]}</button>`).join("")}
function grid(){const l=P.filter(p=>(gen=="all"||String(p[1])==gen)&&(ty=="all"||p[2].split(" ").includes(ty))&&p[0].toLowerCase().includes(q));
$("#grid").innerHTML=l.map(p=>{const i=P.indexOf(p),t=p[2].split(" ");return `<div class="card glass" data-i="${i}"><span class="gen">${p[1]=="ZA"?"Z-A":"Gen "+p[1]}</span><div class="orb" style="background:linear-gradient(135deg,${T[t[0]][1]},${T[t[1]||t[0]][1]})">${p[0][0]}</div><b>${p[0]}</b>${t.map(tag).join("")}</div>`}).join("")||`<p>Aucun résultat.</p>`}
function open(i){const p=P[i],t=p[2].split(" "),s=p[3].split(" ").map(Number),m=mult(t),tot=s.reduce((a,b)=>a+b,0);
const grp=(lbl,f)=>{const k=Object.keys(m).filter(a=>f(m[a]));return k.length?`<span class="w"><b>${lbl}</b> `+k.map(tag).join("")+`</span><br>`:""};
$("#panel").innerHTML=`<button class="x" id="cl">✕</button><h2>${p[0]}</h2>${t.map(tag).join("")}
<h3>Statistiques (total ${tot})</h3>${s.map((v,j)=>`<div class="row"><span class="l">${S[j]}</span><span class="n">${v}</span><div class="bar"><i style="width:${Math.min(100,v/160*100)}%;background:${v>=100?"#34c759":v>=70?"#ffcc00":"#ff6b5c"}"></i></div></div>`).join("")}
<h3>Faiblesses</h3>${grp("×4",v=>v==4)}${grp("×2",v=>v==2)}
<h3>Résistances</h3>${grp("×½",v=>v==.5)}${grp("×¼",v=>v==.25)}${grp("Immunité",v=>v==0)}
${p[4]?"<h3>Talents</h3>":""}${(p[4]||"").split(", ").filter(Boolean).map(x=>`<span class="mv">${x}</span>`).join("")}
${p[5]?"<h3>Capacités apprenables</h3>":""}${(p[5]||"").split(", ").filter(Boolean).map(x=>`<span class="mv">${x}</span>`).join("")}`;
$("#sheet").classList.add("open")}
function gyms(){$("#gyms").innerHTML=G.map((g,i)=>{const c=Object.keys(C).filter(a=>C[a][0].split(" ").includes(g[1]));return `<div class="gym glass"><div class="num" style="background:${T[g[1]][1]}">${i+1}</div><div><b style="font-size:18px">${g[0]}</b> ${tag(g[1])}<p><b>Ville :</b> ${g[2]}</p><p><b>Équipe :</b> ${g[3]}</p><p><b>Niveau du champion :</b> ${g[4]} · <b>Niveau recommandé :</b> ${g[5]}+</p><p><b>Types efficaces :</b> ${c.map(tag).join("")}</p></div></div>`}).join("");
$("#path").innerHTML=G.map((g,i)=>`<div class="st glass"><b>Étape ${i+1} — ${g[2]}</b><p style="margin:4px 0;font-size:13.5px;color:var(--tx2)">Champion ${g[0]} (${T[g[1]][0]}) · niveau conseillé ${g[5]}+</p></div>`).join("")+`${[["Rika","so","57"],["Poppy","ac","58"],["Larry","no vo","59"],["Hassel","dr","60"],["Geeta (Top Champion)","","62"]].map((e,i)=>`<div class="st glass"><b>Ligue ${i+1}/5 — ${e[0]}</b> ${e[1]?e[1].split(" ").map(tag).join(""):""}<p style="margin:4px 0;font-size:13.5px;color:var(--tx2)">${e[1]?"":"Types variés · "}niveau conseillé ~${e[2]}</p></div>`).join("")}`}
document.addEventListener("click",e=>{const b=e.target.closest("[data-g],[data-t],[data-i],[data-v],#cl");if(e.target.id=="sheet")$("#sheet").classList.remove("open");if(!b)return;
if(b.dataset.g){gen=b.dataset.g;chips();grid()}else if(b.dataset.t){ty=b.dataset.t;chips();grid()}else if(b.dataset.i)open(+b.dataset.i);else if(b.dataset.v){document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));$("#v-"+b.dataset.v).classList.add("on");document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x==b));scrollTo(0,0)}else if(b.id=="cl")$("#sheet").classList.remove("open")});
$("#q").addEventListener("input",e=>{q=e.target.value.toLowerCase();grid()});
chips();grid();gyms();
</script>
